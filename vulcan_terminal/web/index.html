<div class="app" id="app">
  <aside class="sidebar" aria-label="Navegação">
    <div class="sidebar-top" data-drag></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-scroll">
      <section class="side-section side-sessions" id="side-sessions" aria-label="Sessões"></section>
      <section class="side-section" id="side-sites" aria-label="Sites">
        <button class="side-heading side-toggle" data-side-toggle="section:sites" aria-expanded="true">
          <svg class="i side-chevron" aria-hidden="true"><use href="#i-chevron-right"></use></svg><span>Sites</span>
        </button>
        <button class="icon-btn icon-btn-sm side-add" id="add-site" title="Adicionar site" aria-label="Adicionar site">
          <svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg></button>
        <div class="side-sites-body">
          <label class="side-filter">
            <svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
            <input id="site-filter" placeholder="Filtrar sites" aria-label="Filtrar sites" autocomplete="off" spellcheck="false">
          </label>
          <div class="site-list" id="site-list" role="list"></div>
        </div>
      </section>
      <section class="side-section" id="side-node" aria-label="Projetos Node">
        <button class="side-heading side-toggle" data-side-toggle="section:node" aria-expanded="true">
          <svg class="i side-chevron" aria-hidden="true"><use href="#i-chevron-right"></use></svg><span>Projetos Node</span>
        </button>
        <button class="icon-btn icon-btn-sm side-add" id="add-node" title="Adicionar projeto Node" aria-label="Adicionar projeto Node">
          <svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg></button>
        <div class="side-sites-body">
          <div class="site-list" id="node-list" role="list"></div>
        </div>
      </section>
    </div>
    <div class="side-env" id="side-env"></div>
  </aside>

  <header class="toolbar" data-drag>
    <div class="crumb" id="crumb"></div>
    <button class="search-trigger" id="open-palette" type="button">
      <svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
      <span>Buscar sites, tarefas, comandos</span><kbd data-mac-shortcut>⌘K</kbd>
    </button>
    <button class="icon-btn help-here" id="help-here" type="button" title="Ajuda desta tela (⌘?)" aria-label="Ajuda desta tela">
      <svg class="i" aria-hidden="true"><use href="#i-help"></use></svg></button>
    <div class="current-session" id="current-session" data-nodrag></div>
    <div class="env" id="env"></div>
  </header>

  <main class="view" id="view"></main>
  <section class="term-panel" id="term-panel" aria-label="Painel de terminal"></section>
</div>

<div class="palette-backdrop" id="palette" hidden>
  <div class="palette" role="dialog" aria-modal="true" aria-label="Buscar">
    <label class="palette-field">
      <svg class="i" aria-hidden="true"><use href="#i-search"></use></svg>
      <input id="palette-input" placeholder="Ir para site, abrir terminal, buscar tarefa…" autocomplete="off" spellcheck="false">
    </label>
    <ul class="palette-results" id="palette-results" role="listbox"></ul>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="vendor/addon-web-links.js"></script>
<script src="vendor/addon-search.js"></script>
<script src="vendor/addon-webgl.js"></script>
<script src="vendor/addon-unicode11.js"></script>
<script src="vendor/addon-serialize.js"></script>
<script type="module" src="js/app.mjs"></script>
</body>
</html>
