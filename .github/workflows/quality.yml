name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # development tools only: the app itself still installs nothing
      - run: pip install ruff==0.8.6
      - run: ruff check .
      - name: Shell scripts
        run: git ls-files '*.sh' packaging/linux/vulcan-celox packaging/linux/vulcan-celox-deps | xargs shellcheck --severity=error
  coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # for information only: it does not block
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install coverage==7.6.10
      - name: Run the suite under coverage
        run: coverage run -m unittest discover -s tests -t . 2>&1 | grep -E '^(FAIL|ERROR):|^Ran |^OK|^FAILED' || true
      - run: coverage report --sort=cover --skip-covered | tee -a "$GITHUB_STEP_SUMMARY"
