name: macOS

# On request, before each release. The interface sensors are timed for a Mac at the desk and still fail on the hosted
# runner, a different one each run; pull requests are checked with validate.sh on a Mac.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: All sensors
        run: bash scripts/validate.sh
