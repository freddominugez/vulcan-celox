name: macOS

# macOS minutes cost ten times more on private repositories, so this runs only on request, before each release.
# Pull requests are checked with validate.sh on a Mac. When the repository goes public, put pull_request back.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: All sensors
        run: bash scripts/validate.sh
